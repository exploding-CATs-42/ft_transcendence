paths:
  /me:
    get:
      tags:
        - Me
      summary: Get current user profile
      description: Retrieves the authenticated user's profile information.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./me.schemas.yaml#/components/schemas/GetMeResponse"
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: User not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error
    patch:
      tags:
        - Me
      summary: Update current user profile
      description: >
        Updates the authenticated user's profile fields. At least one field must be
        provided. Both passwordOld and passwordNew must be provided together to change
        the password, and the new password must differ from the current one.


        Note that the username is not checked for uniqueness before the write, so
        submitting a username that is already taken currently fails as a 500 rather
        than a 409.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./me.schemas.yaml#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "./me.schemas.yaml#/components/schemas/UpdateMeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ValidationErrorResponse"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                invalidToken:
                  summary: Invalid or missing access token
                  value:
                    message: Invalid token

                invalidCurrentPassword:
                  summary: Current password is incorrect
                  value:
                    message: Please enter valid password
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: User not found
        "409":
          description: Request conflict
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                emailAlreadyInUse:
                  value:
                    message: Email already in use 
                missingCurrentPassword:
                  summary: New password provided without current password
                  value:
                    message: Enter your current password to set a new password

                missingNewPassword:
                  summary: Current password provided without new password
                  value:
                    message: Enter your new password
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error
  /me/avatar:
    patch:
      tags:
        - Me
      summary: Update user avatar
      description: >
        Updates the authenticated user's avatar. Accepts an image file upload via
        multipart form data, uploads it to Cloudinary, and stores the resulting URL.


        The file must be at most 2 MB and have an image/* content type. Files that
        breach either limit are rejected by the upload middleware and currently
        surface as a 500 rather than a 400.
      operationId: updateMeAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar image file (max 2 MB, image/* only)
      responses:
        "200":
          description: Avatar updated successfully
          content:
            application/json:
              schema:
                $ref: "./me.schemas.yaml#/components/schemas/UpdateAvatarResponse"
        "400":
          description: No file was supplied in the request
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid file
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: User not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error
  /me/games:
    get:
      tags:
        - Me
      summary: Get current user's game history
      description: >
        Retrieves the authenticated user's finished games, most recently ended first.
        Games that are still waiting or in progress are not included.
      operationId: getMeGames
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User games retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./me.schemas.yaml#/components/schemas/GetMeGamesResponse"
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: User not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error