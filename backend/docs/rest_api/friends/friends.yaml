paths:
  /me/friends:
    get:
      tags:
        - Friends
      summary: List friendship relations
      description: Returns all friendship relations for the authenticated user. The optional "view" query parameter filters which relations are returned.
      operationId: listFriends
      security:
        - bearerAuth: []
      parameters:
        - name: view
          in: query
          required: false
          description: Optional filter for which relations to return. Defaults to all relations.
          schema:
            type: string
            enum:
              - friends_and_requests
              - accepted
              - incoming
      responses:
        "200":
          description: Friendship relations returned successfully
          content:
            application/json:
              schema:
                $ref: "./friends.schemas.yaml#/components/schemas/FriendsListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ValidationErrorResponse"
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error

    post:
      tags:
        - Friends
      summary: Send friend request
      description: Sends a friend request to another user.
      operationId: createFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./friends.schemas.yaml#/components/schemas/CreateFriendRequest"
      responses:
        "201":
          description: Friend request sent successfully
          content:
            application/json:
              schema:
                $ref: "./friends.schemas.yaml#/components/schemas/MessageResponse"
              example:
                message: Friend request sent
        "400":
          description: Validation error, or the target is the caller themselves
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../users/users.schemas.yaml#/components/schemas/ValidationErrorResponse"
                  - $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: Body failed schema validation
                  value:
                    message: Validation error
                    errors:
                      formErrors: []
                      fieldErrors:
                        userId:
                          - Invalid uuid
                selfTarget:
                  summary: Target is the caller
                  value:
                    message: You cannot send a friend request to yourself
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: User not found
        "409":
          description: A friendship relation with this user already exists
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                alreadySent:
                  summary: Caller already has an outgoing pending request
                  value:
                    message: Friend request already sent
                incomingPending:
                  summary: The other user already sent a request to the caller
                  value:
                    message: This user has already sent you a friend request
                alreadyFriends:
                  summary: The relation is already accepted
                  value:
                    message: You cannot send a friend request to your friend
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error

    delete:
      tags:
        - Friends
      summary: Delete friendship relation
      description: Deletes an outgoing pending friend request or an accepted friendship relation.
      operationId: deleteFriendship
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./friends.schemas.yaml#/components/schemas/DeleteFriendshipRequest"
      responses:
        "200":
          description: Friendship deleted successfully
          content:
            application/json:
              schema:
                $ref: "./friends.schemas.yaml#/components/schemas/MessageResponse"
              example:
                message: Friendship deleted
        "400":
          description: Validation error or invalid target
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ValidationErrorResponse"
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Friendship not found
        "409":
          description: Friendship cannot be deleted
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                notDeletable:
                  summary: Relation is neither an outgoing pending request nor accepted
                  value:
                    message: Friendship cannot be deleted
                selfTarget:
                  summary: Target is the caller
                  value:
                    message: Invalid friendship target
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error

  /me/friends/{userId}:
    patch:
      tags:
        - Friends
      summary: Update friendship relation
      description: Accepts or rejects an incoming pending friend request.
      operationId: updateFriendship
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User id of the other side of the friendship relation.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./friends.schemas.yaml#/components/schemas/UpdateFriendshipRequest"
      responses:
        "200":
          description: Friendship updated successfully
          content:
            application/json:
              schema:
                $ref: "./friends.schemas.yaml#/components/schemas/MessageResponse"
              example:
                message: Friendship updated
        "400":
          description: Validation error or invalid target
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ValidationErrorResponse"
        "401":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Invalid token
        "404":
          description: Friendship not found
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Friendship not found
        "409":
          description: Friendship cannot be updated
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              examples:
                onlyPending:
                  value:
                    message: Only pending friendships can be updated
                outgoingRequest:
                  value:
                    message: You cannot accept or reject a request you sent
                selfTarget:
                  summary: Target is the caller
                  value:
                    message: Invalid friendship target
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "../users/users.schemas.yaml#/components/schemas/ApiErrorResponse"
              example:
                message: Internal server error