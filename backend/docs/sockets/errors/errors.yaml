# Every client event has a matching error event. The server emits it to the acting
# socket only, and only when the client did NOT supply an acknowledgement callback
# for that emit — with an ack, the failure is delivered on the callback instead.
#
# All 15 share the same SocketErrorPayload shape, so branch on `code`, not `message`.

channels:
  joinGameError:
    address: join-game-error
    title: Join game error
    description: >
      Sent to the acting socket when `join-game` fails.
      Carries the two codes that clients must act on rather than merely display:
      `RECONNECT_REQUIRED` (emit `reconnect-game` instead) and
      `ALREADY_IN_OTHER_GAME` (whose `errors.existingGameId` names the game the
      player is already in).
    messages:
      socketError:
        name: JoinGameError
        title: Join game error
        summary: Sent to the acting socket when `join-game` fails.
        contentType: application/json
        payload:
          $ref: "./errors.schemas.yaml#/components/schemas/SocketErrorPayload"

  reconnectGameError:
    address: reconnect-game-error
    title: Reconnect game error
    description: >
      Sent to the acting socket when `reconnect-game` fails.
