asyncapi: "3.0.0"

info:
  title: Transcendence Realtime API
  version: "1.0.0"
  description: >
    Realtime API for the ft_transcendence (Exploding Cats) backend.


    Transport is **Socket.IO** (WebSocket with HTTP long-polling fallback),
    not raw AsyncAPI/WebSocket frames. Each "channel" below maps to a
    Socket.IO **event name**, and each operation maps to a `socket.on(...)`
    listener (the server *receives*) or a `socket.emit(...)` / `io.emit(...)`
    call (the server *sends*).


    The server uses the default namespace `/` and the default path `/socket.io`;
    neither is overridden. Nginx proxies both.


    ### Event naming

    Event names are inconsistently cased: some are kebab-case (`join-game`,
    `card-drawn`) and some are SCREAMING_SNAKE (`TURN_CHANGED`, `COMBO_PLAYED`),
    with no rule separating them. The literal strings in
    `packages/contracts/src/sockets/events.ts` are the single source of truth for
    both the backend and the frontend — never derive an event name from the
    constant's key.


    ### Authentication

    Every connection must provide a valid JWT **access token** during the
    Socket.IO handshake:


    ```js

    const socket = io(URL, { auth: { token: accessToken } });

    ```


    The token is read from `socket.handshake.auth.token`. A missing token
    rejects the connection with `Authentication token missing`; an invalid
    token rejects it with `Invalid token`. Both arrive on the client as
    `connect_error` with a plain message — they are *not* `SocketErrorPayload`
    objects and carry no error code.


    On success only the user id is kept, as `socket.data.user = { id: sub }`;
    the rest of the JWT payload is discarded.


    ### Rooms

    A socket belongs to two kinds of room, both named with a bare UUID:


    - the **game room**, named after the `gameId`, joined on `join-game` or
      `reconnect-game` and left on `leave-game`; and
    - a **personal room**, named after the user's own id, joined automatically on
      connection and used for presence and friend notifications.


    Because both are plain UUIDs in one keyspace, a game room and a personal room
    are indistinguishable by name.


    Presence is derived from personal-room membership rather than a separate map,
    so it is multi-tab safe: online/offline events fire only on the first and last
    socket.


    ### One account, many windows

    A player is identified by their user id, never by a socket. The same account may
    have several windows open on one game: they all authenticate with the same token,
    all join the game room, and all share a single seat — the state machine holds one
    `Player` per account no matter how many windows joined.

    Delivery therefore addresses the **personal room** rather than any one socket, so
    every window of an account stays in sync. The helpers in
    `backend/src/sockets/emitters.ts` are the only supported way to do this.


    ### Delivery scope

    In the operations below, scope is one of:


    - **player (all windows)** — one specific player, addressed through their
      personal room (`emitToPlayer`). Every window that account has open receives
      it. Used for everything private to a player: their hand, and prompts aimed at
      them.
    - **room (others)** — everyone in the game room except *every window* of the
      named player (`emitToGameExceptPlayer`). Used for public events describing
      what one player just did.
    - **room (all)** — everyone in the game room, the acting player included
      (`io.to(room).emit`).
    - **acting socket** — only the single client that triggered the action
      (`socket.emit`). Reserved for direct replies to a request — `waiting-state`,
      `game-state` and the per-action `*-error` events — never for state changes,
      which must reach every window.
    - **broadcast** — every connected client (`io.emit`). Only the lobby channel
      uses this.


    ### Acknowledgements

    Every client event optionally accepts a Socket.IO acknowledgement callback. When
    the client supplies one (`emitWithAck`, or a trailing callback), the server
    replies with a `SocketAckPayload`:


    ```js

    const ack = await socket.timeout(5000).emitWithAck("join-game", { gameId });

    // { ok: true } | { ok: false, code, message }

    ```


    **Supplying an acknowledgement suppresses the matching `*-error` event.** The
    two error paths are mutually exclusive: with an ack the failure comes back on
    the callback only; without one it arrives as the `*-error` event. The ack
    variant also omits the `errors` details, carrying just `code` and `message`.


    ### Reserved event names

    Five constants exist in `events.ts` but are never emitted by the server and have
    no channel here: `FAVOR_REQUESTED`, `FAVOR_RESOLVED`, `YOUR_HAND`,
    `INSERT_KITTEN_PROMPT` and `FAVOR_MUST_GIVE`. Favor is implemented through
    `select-player` / `give-card` and the `WAITING_FOR_*` events instead.

  tags:
    - name: Connection
      description: Connection lifecycle, authentication, state recovery and presence.
    - name: Lobby
      description: Global broadcasts keeping every client's lobby list current.
    - name: Waiting Room
      description: Pre-game waiting room — join, leave, ready-up and countdown.
    - name: Gameplay
      description: Turn-by-turn play, from the first draw to game over.
    - name: Errors
      description: Per-action error events emitted back to the acting socket.

