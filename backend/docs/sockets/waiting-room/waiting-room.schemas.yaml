components:
  schemas:
    GameIdPayload:
      $ref: "../common/common.schemas.yaml#/components/schemas/GameIdPayload"

    WaitingPlayerView:
      type: object
      required:
        - id
        - name
        - avatarUrl
        - isConnected
        - isConfirmed
      properties:
        id:
          type: string
          format: uuid
          description: Player (user) id.
        name:
          type: string
          description: Player display name (their username).
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Player avatar URL, or null when they have not set one.
        isConnected:
          type: boolean
          description: >
            Whether the player currently has at least one connected socket. Derived
            live from socket presence, not stored on the player.
        isConfirmed:
          type: boolean
          description: Whether the player has confirmed they are ready to start.

    WaitingStatePayload:
      type: object
      required:
        - players
        - meId
        - countdownEndsAt
      properties:
        players:
          type: array
          description: All players currently in the waiting room.
          items:
            $ref: "#/components/schemas/WaitingPlayerView"
        meId:
          type: string
          format: uuid
          description: Id of the player receiving this snapshot.
        countdownEndsAt:
          type: integer
          format: int64
          nullable: true
          description: >
            Unix epoch timestamp in milliseconds at which the running countdown ends,
            or null when no countdown is running. Present so a socket that joins
            mid-countdown can render the correct remaining time.

    PlayerJoinedPayload:
      type: object
      required:
        - player
      properties:
        player:
          $ref: "#/components/schemas/WaitingPlayerView"

    PlayerIdPayload:
      $ref: "../common/common.schemas.yaml#/components/schemas/PlayerIdPayload"

    CountdownStartedPayload:
      type: object
      required:
        - endsAt
      properties:
        endsAt:
          type: integer
          format: int64
          description: >
            Unix epoch timestamp in milliseconds at which the countdown ends
            (`Date.now() + 10000`).
          example: 1781990400000

    EmptyPayload:
      $ref: "../common/common.schemas.yaml#/components/schemas/EmptyPayload"

    GameStartedPayload:
      $ref: "../common/common.schemas.yaml#/components/schemas/GameStartedPayload"
